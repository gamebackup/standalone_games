<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="icon" type="image/png" href="TemplateData/favicon.ico" />
    <script src="TemplateData/UnityProgress.js"></script>
</head>
<body>
    <div class="webgl-content">
        <div id="gameContainer" style="width: 100%; height: 100%;"></div>
        <div class="footer">
            <div class="webgl-logo"></div>
            <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        </div>
    </div>
    <script src="Build/BlockBlast1.1-8.loader.js"></script>
    <script>
        var canvas = document.querySelector("#gameContainer");
        var progress = new UnityProgress(canvas);
        var buildUrl = "Build";
        var config = {
            dataUrl: buildUrl + "/BlockBlast1.1-8.data.unityweb",
            frameworkUrl: buildUrl + "/BlockBlast1.1-8.framework.js.unityweb",
            codeUrl: buildUrl + "/BlockBlast1.1-8.wasm.unityweb",
            companyName: "Block Blast",
            productName: "Block Blast",
            productVersion: "1.1.8",
        };
        var gameInstance = createUnityInstance(canvas, config, function(progressValue) {
            progress.SetProgress(progressValue);
            if (progressValue === 1) {
                progress.SetComplete();
            }
        }).then(function(instance) {
            progress.SetComplete();
        }).catch(function(message) {
            progress.SetError(message);
        });
    </script>
</body>
</html>
